<nav class="navbar">
  <a class="brand" routerLink="/">
    <span class="brand-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <rect x="4" y="4" width="16" height="16" rx="5" fill="currentColor" fill-opacity="0.22" />
        <path d="M12 7v10M7 12h10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
      </svg>
    </span>
    <span class="brand-name">HealthPoints</span>
  </a>

  <div class="nav-links">
    <!-- Current staff switcher (#20) -->
    @if (staffList.length > 0) {
      <div class="staff-switcher-wrap">
        <button
          type="button"
          class="staff-switcher"
          [class.open]="staffMenuOpen()"
          (click)="toggleStaffMenu()"
          title="Staff currently billing"
        >
          <span class="staff-switcher-icon" aria-hidden="true">👤</span>
          <span class="staff-switcher-name">{{ staffService.activeStaff() || 'Select staff' }}</span>
          <span class="staff-switcher-caret" aria-hidden="true">▾</span>
        </button>

        @if (staffMenuOpen()) {
          <div class="staff-menu-backdrop" (click)="closeStaffMenu()"></div>
          <ul class="staff-menu">
            @for (name of staffList; track name) {
              <li>
                <button
                  type="button"
                  class="staff-menu-item"
                  [class.active]="name === staffService.activeStaff()"
                  (click)="selectStaff(name)"
                >
                  <span>{{ name }}</span>
                  @if (name === staffService.activeStaff()) {
                    <span class="staff-menu-check" aria-hidden="true">✓</span>
                  }
                </button>
              </li>
            }
          </ul>
        }
      </div>
    } @else {
      <a routerLink="/admin" class="staff-add-hint">+ Add staff</a>
    }

    <span
      class="data-status-chip"
      [class.live]="bootstrapDataService.status() === 'live'"
      [class.offline]="bootstrapDataService.status() === 'offline'"
    >
      {{ hydrationLabel }}
    </span>

    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      Dashboard
    </a>
    <a routerLink="/billing" routerLinkActive="active" class="btn-context-action btn-context-action-compact">
      + New Bill
    </a>
    <a routerLink="/admin" routerLinkActive="active">
      Admin
      @if (pendingCount > 0) {
        <span class="badge">{{ pendingCount }}</span>
      }
    </a>
  </div>
</nav>
